spring.application.name=ticketing

spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing
spring.datasource.username=ticketing
spring.datasource.password=ticketing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

ticketing.mail.from=${MAIL_FROM:tickets@accordion-symphonic.de}
ticketing.mail.from-name=${MAIL_FROM_NAME:Accordion Symphonic}

ticketing.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

ticketing.order.max-tickets-per-order=10

# Admin API credentials: set these environment variables before starting the app.
# No password default is supplied deliberately, so the application does not start insecurely.
ticketing.security.admin.username=${ADMIN_USERNAME}
ticketing.security.admin.password=${ADMIN_PASSWORD}

ticketing.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET}