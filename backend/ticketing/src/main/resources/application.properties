spring.application.name=ticketing

spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing
spring.datasource.username=ticketing
spring.datasource.password=ticketing

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

# Admin API credentials: set these environment variables before starting the app.
# No password default is supplied deliberately, so the application does not start insecurely.
ticketing.security.admin.username=${ADMIN_USERNAME}
ticketing.security.admin.password=${ADMIN_PASSWORD}

ticketing.payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}