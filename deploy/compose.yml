services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-Shell", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend/ticketing

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing
      SPRING_DATASOURCE_USERNAME: ticketing
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      TICKETING_PAYMENT_PROVIDER: fake
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}

      TZ: Europe/Berlin
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
